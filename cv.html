<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --eu:#1A4D96; --text:#1D1D1B; --grey:#5F6368; --line:#1A4D96; }
*{box-sizing:border-box}
body{margin:0;background:#E6E8EB;color:var(--text);font:400 9.6pt/1.45 "Open Sans", Arial, Helvetica, sans-serif}

.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d0d4d9;
  padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem .7rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font:14px/1.3 "Open Sans", Arial, sans-serif}
.toolbar a{color:var(--eu)}
.toolbar button{font:600 14px/1 "Open Sans", Arial, sans-serif;background:var(--eu);color:#fff;border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer}
.toolbar button:focus-visible,.toolbar a:focus-visible{outline:3px solid #F2B600;outline-offset:2px}
.toolbar .hint{color:var(--grey);font-size:13px}
.toolbar .spacer{flex:1}

.page{width:210mm;max-width:100%;min-height:297mm;margin:1.5rem auto 3rem;background:#fff;padding:14mm 15mm;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* header */
.head{display:flex;gap:6mm;align-items:flex-start;padding-bottom:4mm}
.head img{width:30mm;height:36mm;object-fit:cover;border-radius:2px}
.head h1{font-size:21pt;line-height:1.1;margin:0 0 1.5mm;font-weight:700;color:var(--text)}
.head .title{font-size:11pt;color:var(--eu);font-weight:600;margin:0 0 3mm}
.contacts{display:flex;flex-wrap:wrap;gap:1.2mm 5mm;margin:0;padding:0;list-style:none;font-size:9pt}
.contacts li{display:flex;align-items:center;gap:1.5mm}
.contacts svg{width:3.4mm;height:3.4mm;flex:none;fill:var(--eu)}
.contacts a{color:var(--text);text-decoration:none}
.contacts b{font-weight:600}

/* Europass sections */
h2{color:var(--eu);font-size:11pt;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
   margin:6mm 0 3mm;padding-bottom:1.2mm;border-bottom:1.3px solid var(--line);break-after:avoid;page-break-after:avoid}
.entry{margin:0 0 4.2mm}
.meta{color:var(--grey);font-size:8.6pt;margin-bottom:.6mm}
.meta .dates{color:var(--eu);font-weight:600}
.meta .sep{margin:0 1.5mm;color:#bbb}
.etitle{font-weight:700;font-size:10.2pt;text-transform:uppercase;letter-spacing:.01em;break-after:avoid}
.org{font-size:9.4pt;margin-bottom:1.2mm}
.sub{font-weight:600;font-size:9.2pt;margin:1.8mm 0 .6mm;break-after:avoid}
ul{margin:0;padding-left:4.5mm}
li{margin:.5mm 0;break-inside:avoid}
p{margin:0}
.skills-row{display:grid;grid-template-columns:34mm 1fr;gap:3mm;margin-bottom:1.4mm;break-inside:avoid}
.skills-row .k{font-weight:600}
.stack{color:var(--grey);font-size:8.8pt;margin-top:.8mm}
.stack a{color:var(--eu)}

/* language table (Europass CEFR grid) */
.lang-mt{margin-bottom:2.5mm}
table.cefr{width:100%;border-collapse:collapse;font-size:8.6pt;text-align:center;break-inside:avoid}
table.cefr th,table.cefr td{border:1px solid #C9D3E3;padding:1.2mm 1mm}
table.cefr thead tr:first-child th{background:#E9EFF8;color:var(--eu);text-transform:uppercase;font-size:8pt}
table.cefr thead tr:nth-child(2) th{font-weight:600;background:#F5F7FB}
table.cefr td:first-child{text-align:left;font-weight:600}
.cefr-note{font-size:7.8pt;color:var(--grey);margin-top:1.2mm}

@page{ size:A4; margin:12mm 13mm 14mm;
  @bottom-right{ content:"Page " counter(page) " / " counter(pages); font:8pt "Open Sans", Arial, sans-serif; color:#777; } }
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  a{color:inherit}
  .entry{break-inside:auto}
}
@media (max-width:820px){
  .page{padding:6mm 5mm;margin:0;min-height:0;box-shadow:none}
  .skills-row{grid-template-columns:1fr;gap:0}
}
</style>
<script src="data.js"></script>
</head>
<body>
<div class="toolbar">
  <a href="index.html">← Portfolio</a>
  <span class="spacer"></span>
  <span class="hint">In the print window, choose “Save as PDF”.</span>
  <button type="button" id="dl">Download PDF</button>
</div>

<main class="page" id="cv"></main>

<script>
(function(){
  const D = window.CV, U = window.CVUtil, e = U.esc.bind(U), p = D.person;
  const E = (a,b) => U.range(a, b, "europass");
  document.title = p.fullName.replace(/\s+/g, "_") + "_CV_Europass";

  const icon = {
    phone:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5z"/></svg>',
    home:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>',
    web:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.9a15.7 15.7 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 010-4h3.4a16.5 16.5 0 000 4zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 015.1 16zM8 8H5.1a8 8 0 014.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 010-4h4.6a14.7 14.7 0 010 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 01-4.3 3.6zm1.7-5.6a16.5 16.5 0 000-4h3.4a8 8 0 010 4z"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 010-1.4l3.5-3.5a1 1 0 111.4 1.4L12 13.4a1 1 0 01-1.4 0zM8.5 17.7a3 3 0 01-4.2-4.2L7 10.8a1 1 0 00-1.4-1.4L2.9 12a5 5 0 007 7l2.7-2.7a1 1 0 00-1.4-1.4zM21.1 2.9a5 5 0 00-7 0l-2.7 2.7a1 1 0 001.4 1.4l2.7-2.7a3 3 0 014.2 4.2L17 11.2a1 1 0 001.4 1.4l2.7-2.7a5 5 0 000-7z"/></svg>'
  };
  const strip = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const contacts = [
    p.nationality && `<li><b>Nationality:</b> ${e(p.nationality)}</li>`,
    p.dateOfBirth && `<li><b>Date of birth:</b> ${e(p.dateOfBirth)}</li>`,
    p.phone && `<li>${icon.phone}<a href="tel:${e(p.phone.replace(/\s/g,""))}">${e(p.phone)}</a></li>`,
    p.email && `<li>${icon.mail}<a href="mailto:${e(p.email)}">${e(p.email)}</a></li>`,
    p.website && `<li>${icon.web}<a href="${e(p.website)}">${e(strip(p.website))}</a></li>`,
    p.github && `<li>${icon.link}<a href="${e(p.github)}">${e(strip(p.github))}</a></li>`,
    p.linkedin && `<li>${icon.link}<a href="${e(p.linkedin)}">${e(strip(p.linkedin))}</a></li>`,
    p.location && `<li>${icon.home}${e(p.location)}</li>`
  ].filter(Boolean).join("");

  const meta = (dates, loc) => `<div class="meta"><span class="dates">[ ${e(dates)} ]</span>${loc ? `<span class="sep">|</span>${e(loc)}` : ""}</div>`;
  const list = items => `<ul>${items.map(i => `<li>${e(i)}</li>`).join("")}</ul>`;

  let html = `
  <header class="head">
    ${p.photo ? `<img src="${e(p.photo)}" alt="">` : ""}
    <div>
      <h1>${e(p.fullName)}</h1>
      <p class="title">${e(p.title)}</p>
      <ul class="contacts">${contacts}</ul>
    </div>
  </header>

  <h2>About me</h2>
  <p>${e(D.cvSummary)}</p>

  <h2>Work experience</h2>
  ${D.experience.map(j => `
    <div class="entry">
      ${meta(E(j.start, j.end), j.location)}
      <div class="etitle">${e(j.title)}</div>
      <div class="org">${e(j.org)}</div>
      ${j.groups ? j.groups.map(g => `<div class="sub">${e(g.name)}</div>${list(g.items)}`).join("") : list(j.items || [])}
    </div>`).join("")}

  <h2>Education and training</h2>
  ${D.education.map(ed => `
    <div class="entry">
      ${meta(ed.start ? E(ed.start, ed.end) : E("", ed.end), ed.location)}
      <div class="etitle">${e(ed.title)}</div>
      <div class="org">${e(ed.org)}</div>
      ${ed.note ? `<p><b>Final grade:</b> ${e(ed.note)}</p>` : ""}
    </div>`).join("")}`;

  const L = D.languages || {};
  if (L.motherTongues && L.motherTongues.length) {
    html += `<h2>Language skills</h2>
      <p class="lang-mt">Mother tongue(s): <b>${L.motherTongues.map(e).join(", ")}</b></p>`;
    if (L.other && L.other.length) {
      html += `<p class="lang-mt">Other language(s):</p>
      <table class="cefr">
        <thead>
          <tr><th rowspan="2"></th><th colspan="2">Understanding</th><th colspan="2">Speaking</th><th>Writing</th></tr>
          <tr><th>Listening</th><th>Reading</th><th>Spoken production</th><th>Spoken interaction</th><th></th></tr>
        </thead>
        <tbody>${L.other.map(l => `<tr><td>${e(l.language)}</td><td>${e(l.listening)}</td><td>${e(l.reading)}</td><td>${e(l.production)}</td><td>${e(l.interaction)}</td><td>${e(l.writing)}</td></tr>`).join("")}</tbody>
      </table>
      <p class="cefr-note">Levels: A1 and A2: Basic user; B1 and B2: Independent user; C1 and C2: Proficient user</p>`;
    }
  }

  html += `<h2>Digital skills</h2>
    ${D.skills.map(s => `<div class="skills-row"><div class="k">${e(s.group)}</div><div>${s.items.map(e).join(" | ")}</div></div>`).join("")}`;

  const cvProjects = D.projects.filter(pr => pr.showOnCV);
  if (cvProjects.length) {
    html += `<h2>Projects</h2>
      ${cvProjects.map(pr => `
      <div class="entry">
        <div class="etitle">${e(pr.name)}${pr.status ? ` <span style="text-transform:none;font-weight:400;color:var(--grey)">(${e(pr.status)})</span>` : ""}</div>
        <div class="org">${e(pr.context)}</div>
        <p>${e(pr.description)}</p>
        <p class="stack">${pr.stack.map(e).join(", ")}${pr.link ? ` | <a href="${e(pr.link)}">${e(strip(pr.link))}</a>` : ""}</p>
      </div>`).join("")}`;
  }

  if (D.certifications && D.certifications.length) {
    html += `<h2>Courses and certifications</h2>${list(D.certifications)}`;
  }

  const R = D.references || {};
  html += `<h2>References</h2>`;
  if (R.mode === "list" && R.people && R.people.length) {
    html += R.people.map(r => `
      <div class="entry">
        <div class="etitle" style="text-transform:none">${e(r.name)}</div>
        <div class="org">${e([r.role, r.org].filter(Boolean).join(", "))}</div>
        <p>${[r.phone && e(r.phone), r.email && `<a href="mailto:${e(r.email)}">${e(r.email)}</a>`].filter(Boolean).join(" | ")}</p>
      </div>`).join("");
  } else {
    html += `<p>References available upon request.</p>`;
  }

  document.getElementById("cv").innerHTML = html;

  const doPrint = () => window.print();
  document.getElementById("dl").addEventListener("click", doPrint);
  if (new URLSearchParams(location.search).get("print") === "1") {
    const go = () => setTimeout(doPrint, 350);
    (document.fonts && document.fonts.ready) ? document.fonts.ready.then(go) : window.addEventListener("load", go);
  }
})();
</script>
</body>
</html>
